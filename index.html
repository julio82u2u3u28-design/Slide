<div class="slider-container">
  <div class="slider-header">
    <span class="slider-label">Sensibilidade / Opacidade</span>
    <span id="slider-value" class="slider-value">50%</span>
  </div>
  <input 
    type="range" 
    min="0" 
    max="100" 
    value="50" 
    class="custom-slider" 
    id="mySlider" 
    oninput="updateSlider(this)"
  >
</div>
